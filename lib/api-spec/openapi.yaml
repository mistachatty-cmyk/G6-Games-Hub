openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: games
    description: Game social operations
  - name: members
    description: Member profiles, badges, and roles
  - name: forum
    description: Public community forum and moderation
  - name: leaderboard
    description: Privacy-safe community participation rankings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUser"
  /login:
    get:
      operationId: login
      tags: [auth]
      summary: Start sign-in
      responses:
        "302":
          description: Redirects to the identity provider
  /callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Complete sign-in
      responses:
        "302":
          description: Redirects back to the app
  /logout:
    get:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "302":
          description: Redirects back to the app
  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: List configured sign-in providers
      responses:
        "200":
          description: Sign-in provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
  /members/badges:
    get:
      operationId: getMemberBadges
      tags: [members]
      summary: List the G6 badge catalog
      responses:
        "200":
          description: Public badge catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"
  /members/me:
    get:
      operationId: getMyMemberProfile
      tags: [members]
      summary: Get the signed-in member profile
      responses:
        "200":
          description: Current member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMyMemberProfile
      tags: [members]
      summary: Update the signed-in member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileInput"
      responses:
        "200":
          description: Updated member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          description: Invalid profile update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Display name already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/{userId}:
    get:
      operationId: getMemberPublicProfile
      tags: [members]
      summary: Get a public member profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: Public member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPublicProfile"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/roles:
    get:
      operationId: getMemberRoles
      tags: [members]
      summary: List member roles for the owner
      responses:
        "200":
          description: Member role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRoleRecord"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/roles/{userId}:
    patch:
      operationId: updateMemberRole
      tags: [members]
      summary: Assign or revoke an admin or moderator role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          description: Updated role assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRoleRecord"
        "400":
          description: Invalid role update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/categories:
    get:
      operationId: getForumCategories
      tags: [forum]
      summary: List forum categories
      responses:
        "200":
          description: Public forum categories with thread counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForumCategory"
  /forum/categories/{slug}/threads:
    get:
      operationId: listForumCategoryThreads
      tags: [forum]
      summary: List paginated threads in a forum category
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 48
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            multipleOf: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            multipleOf: 1
            default: 12
      responses:
        "200":
          description: Paginated public thread summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadPage"
        "404":
          description: Forum category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/thread/{id}:
    get:
      operationId: getForumThreadDetail
      tags: [forum]
      summary: Get a public forum thread and paginated replies
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
        - name: replyPage
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            multipleOf: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            multipleOf: 1
            default: 20
      responses:
        "200":
          description: Public thread detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadDetail"
        "404":
          description: Forum thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/threads:
    post:
      operationId: createForumThread
      tags: [forum]
      summary: Create a forum thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumThreadInput"
      responses:
        "201":
          description: Created forum thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadDetail"
        "400":
          description: Invalid thread content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum category not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many forum actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/threads/{id}/replies:
    post:
      operationId: createForumReply
      tags: [forum]
      summary: Reply to a forum thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumReplyInput"
      responses:
        "201":
          description: Created forum reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReply"
        "400":
          description: Invalid reply content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Thread is locked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many forum actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/threads/{id}:
    patch:
      operationId: updateForumThread
      tags: [forum]
      summary: Edit or remove your forum thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumThreadUpdate"
      responses:
        "200":
          description: Updated forum thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadDetail"
        "400":
          description: Invalid thread update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Edit window or ownership denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteForumThread
      tags: [forum]
      summary: Remove your forum thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      responses:
        "204":
          description: Thread removed
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Edit window or ownership denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/replies/{id}:
    patch:
      operationId: updateForumReply
      tags: [forum]
      summary: Edit or remove your forum reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumReplyUpdate"
      responses:
        "200":
          description: Updated forum reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReply"
        "400":
          description: Invalid reply update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Edit window or ownership denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum reply not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteForumReply
      tags: [forum]
      summary: Remove your forum reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      responses:
        "204":
          description: Reply removed
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Edit window or ownership denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum reply not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/reports:
    post:
      operationId: createForumReport
      tags: [forum]
      summary: Report a forum thread or reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumReportInput"
      responses:
        "201":
          description: Report received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReportReceipt"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum content not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many forum actions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/moderation/reports:
    get:
      operationId: listForumModerationReports
      tags: [forum]
      summary: List reports for moderators
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            multipleOf: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: number
            minimum: 1
            maximum: 50
            multipleOf: 1
            default: 20
      responses:
        "200":
          description: Moderation report queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumModerationPage"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Moderator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/moderation/reports/{id}:
    patch:
      operationId: resolveForumReport
      tags: [forum]
      summary: Resolve or dismiss a forum report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumReportUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumModerationReport"
        "400":
          description: Invalid report update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Moderator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum report not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/moderation/threads/{id}:
    patch:
      operationId: moderateForumThread
      tags: [forum]
      summary: Moderate a forum thread
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumModerationInput"
      responses:
        "200":
          description: Updated thread moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumThreadDetail"
        "400":
          description: Invalid moderation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Moderator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum thread not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /forum/moderation/replies/{id}:
    patch:
      operationId: moderateForumReply
      tags: [forum]
      summary: Moderate a forum reply
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForumModerationInput"
      responses:
        "200":
          description: Updated reply moderation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumReply"
        "400":
          description: Invalid moderation action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Moderator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Forum reply not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /leaderboard:
    get:
      operationId: getLeaderboard
      tags: [leaderboard]
      summary: Get public community rankings
      parameters:
        - name: window
          in: query
          required: false
          schema:
            type: string
            enum: [weekly, monthly, all-time]
            default: weekly
      responses:
        "200":
          description: Public community leaderboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardResponse"
  /leaderboard/activity:
    post:
      operationId: recordLeaderboardActivity
      tags: [leaderboard]
      summary: Record a coarse engaged member activity pulse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaderboardActivityInput"
      responses:
        "200":
          description: Activity pulse recorded within the daily cap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardActivityReceipt"
        "400":
          description: Invalid activity pulse
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /leaderboard/moderation/diagnostics:
    get:
      operationId: getLeaderboardDiagnostics
      tags: [leaderboard]
      summary: Get aggregate leaderboard diagnostics for moderators
      responses:
        "200":
          description: Aggregate leaderboard diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderboardDiagnostics"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Moderator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/stats:
    get:
      operationId: getGameSocialStats
      tags: [games]
      summary: Get aggregate stars and this browser's star state
      parameters:
        - name: voterId
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Social stats for all registered games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSocialStats"
  /games/{slug}/star:
    post:
      operationId: toggleGameStar
      tags: [games]
      summary: Star or unstar a game for this browser
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameStarInput"
      responses:
        "200":
          description: Updated star state and aggregate count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSocialStats"
        "400":
          description: Invalid star request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/{slug}/feedback:
    post:
      operationId: submitGameFeedback
      tags: [games]
      summary: Send private feedback about a game
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameFeedbackInput"
      responses:
        "201":
          description: Feedback received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/feedback:
    get:
      operationId: getGameFeedback
      tags: [games]
      summary: List private feedback for the game owner
      responses:
        "200":
          description: Feedback grouped by game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackGroup"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/feedback/{id}:
    patch:
      operationId: reviewGameFeedback
      tags: [games]
      summary: Mark private feedback as reviewed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackReviewInput"
      responses:
        "200":
          description: Updated private feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackNote"
        "400":
          description: Invalid feedback review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required: [id, email, firstName, lastName, profileImageUrl]
    CurrentAuthUser:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        isOwner:
          type: boolean
        role:
          $ref: "#/components/schemas/MemberRole"
      required: [user, isOwner, role]
    AuthProvider:
      type: string
      enum: [replit, google, apple]
    AuthProviderOption:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AuthProvider"
        label:
          type: string
        enabled:
          type: boolean
      required: [id, label, enabled]
    AuthProviders:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProviderOption"
      required: [providers]
    LeaderboardMetric:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        value:
          type: number
          multipleOf: 1
        points:
          type: number
          multipleOf: 1
        enabled:
          type: boolean
      required: [key, label, value, points, enabled]
    LeaderboardScoringRule:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        points:
          type: number
          multipleOf: 1
        dailyCap:
          type: ["number", "null"]
          multipleOf: 1
        enabled:
          type: boolean
        description:
          type: string
      required: [key, label, points, dailyCap, enabled, description]
    LeaderboardAuthor:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
      required: [userId, displayName, badge]
    LeaderboardEntry:
      allOf:
        - $ref: "#/components/schemas/LeaderboardAuthor"
        - type: object
          properties:
            rank:
              type: number
              multipleOf: 1
            score:
              type: number
              multipleOf: 1
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/LeaderboardMetric"
          required: [rank, score, metrics]
    LeaderboardResponse:
      type: object
      properties:
        window:
          type: string
          enum: [weekly, monthly, all-time]
        generatedAt:
          type: string
          format: date-time
        refreshAfterSeconds:
          type: number
          multipleOf: 1
        scoring:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardScoringRule"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        viewerRank:
          type: ["number", "null"]
          multipleOf: 1
      required: [window, generatedAt, refreshAfterSeconds, scoring, entries, viewerRank]
    LeaderboardActivityInput:
      type: object
      properties:
        engagedMinutes:
          type: number
          minimum: 1
          maximum: 5
          multipleOf: 1
      required: [engagedMinutes]
      additionalProperties: false
    LeaderboardActivityReceipt:
      type: object
      properties:
        recorded:
          type: boolean
        dailyCapMinutes:
          type: number
          multipleOf: 1
      required: [recorded, dailyCapMinutes]
    LeaderboardDiagnostics:
      type: object
      properties:
        generatedAt:
          type: string
          format: date-time
        cachedWindows:
          type: array
          items:
            type: string
            enum: [weekly, monthly, all-time]
        rankedMembers:
          type: number
          multipleOf: 1
        cappedDailyMinutes:
          type: number
          multipleOf: 1
        futureEventSources:
          type: array
          items:
            type: string
        anomalies:
          type: array
          items:
            type: string
      required: [generatedAt, cachedWindows, rankedMembers, cappedDailyMinutes, futureEventSources, anomalies]
    Badge:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        isSelectable:
          type: boolean
      required: [slug, name, description, isDefault, isSelectable]
    MemberRole:
      type: string
      enum: [member, moderator, admin, owner]
    MemberPublicProfile:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
        createdAt:
          type: string
          format: date-time
      required: [userId, displayName, badge, createdAt]
    MemberProfile:
      allOf:
        - $ref: "#/components/schemas/MemberPublicProfile"
        - type: object
          properties:
            role:
              $ref: "#/components/schemas/MemberRole"
            earnedBadges:
              type: array
              items:
                type: string
          required: [role, earnedBadges]
    MemberProfileInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 24
          pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{1,23}$"
        badgeSlug:
          type: string
          enum: [lok-clone, lok-knight, lokness-monster, lok-clown, lok-loner, lok-lit]
      minProperties: 1
      additionalProperties: false
    MemberRoleRecord:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
        role:
          $ref: "#/components/schemas/MemberRole"
      required: [userId, displayName, badge, role]
    MemberRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [member, moderator, admin]
      required: [role]
      additionalProperties: false
    GameSocialStats:
      type: object
      properties:
        gameSlug:
          type: string
        starCount:
          type: number
          minimum: 0
        starred:
          type: boolean
      required: [gameSlug, starCount, starred]
    GameStarInput:
      type: object
      properties:
        voterId:
          type: string
          minLength: 16
          maxLength: 120
        starred:
          type: boolean
      required: [voterId, starred]
    GameFeedbackInput:
      type: object
      properties:
        content:
          type: string
          minLength: 4
          maxLength: 2000
      required: [content]
    FeedbackReceipt:
      type: object
      properties:
        received:
          type: boolean
        message:
          type: string
      required: [received, message]
    FeedbackAuthor:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
      required: [id, email, firstName, lastName]
    FeedbackNote:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        gameSlug:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, reviewed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/FeedbackAuthor"
      required: [id, gameSlug, content, status, createdAt, updatedAt, author]
    FeedbackGroup:
      type: object
      properties:
        gameSlug:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackNote"
      required: [gameSlug, notes]
    FeedbackReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [reviewed]
      required: [status]
    ForumCategory:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        threadCount:
          type: number
          minimum: 0
          multipleOf: 1
      required: [id, slug, name, description, threadCount]
    ForumAuthor:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
      required: [userId, displayName, badge]
    ForumThreadSummary:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        categorySlug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        author:
          $ref: "#/components/schemas/ForumAuthor"
        replyCount:
          type: number
          minimum: 0
          multipleOf: 1
        isPinned:
          type: boolean
        isLocked:
          type: boolean
        createdAt:
          type: string
          format: date-time
        lastActivityAt:
          type: string
          format: date-time
      required: [id, categorySlug, title, excerpt, author, replyCount, isPinned, isLocked, createdAt, lastActivityAt]
    ForumThread:
      allOf:
        - $ref: "#/components/schemas/ForumThreadSummary"
        - type: object
          properties:
            content:
              type: string
            canEdit:
              type: boolean
            canRemove:
              type: boolean
          required: [content, canEdit, canRemove]
    ForumReply:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        threadId:
          type: number
          multipleOf: 1
        content:
          type: string
        author:
          $ref: "#/components/schemas/ForumAuthor"
        canEdit:
          type: boolean
        canRemove:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, threadId, content, author, canEdit, canRemove, createdAt, updatedAt]
    ForumPageInfo:
      type: object
      properties:
        page:
          type: number
          minimum: 1
          multipleOf: 1
        pageSize:
          type: number
          minimum: 1
          multipleOf: 1
        total:
          type: number
          minimum: 0
          multipleOf: 1
        totalPages:
          type: number
          minimum: 0
          multipleOf: 1
      required: [page, pageSize, total, totalPages]
    ForumThreadPage:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/ForumCategory"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ForumThreadSummary"
        pagination:
          $ref: "#/components/schemas/ForumPageInfo"
      required: [category, items, pagination]
    ForumThreadDetail:
      type: object
      properties:
        thread:
          $ref: "#/components/schemas/ForumThread"
        replies:
          type: array
          items:
            $ref: "#/components/schemas/ForumReply"
        pagination:
          $ref: "#/components/schemas/ForumPageInfo"
      required: [thread, replies, pagination]
    ForumThreadInput:
      type: object
      properties:
        categorySlug:
          type: string
          minLength: 1
          maxLength: 48
        title:
          type: string
          minLength: 4
          maxLength: 120
        content:
          type: string
          minLength: 10
          maxLength: 5000
      required: [categorySlug, title, content]
      additionalProperties: false
    ForumThreadUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 4
          maxLength: 120
        content:
          type: string
          minLength: 10
          maxLength: 5000
        remove:
          type: boolean
      minProperties: 1
      additionalProperties: false
    ForumReplyInput:
      type: object
      properties:
        content:
          type: string
          minLength: 2
          maxLength: 3000
      required: [content]
      additionalProperties: false
    ForumReplyUpdate:
      type: object
      properties:
        content:
          type: string
          minLength: 2
          maxLength: 3000
        remove:
          type: boolean
      minProperties: 1
      additionalProperties: false
    ForumReportInput:
      type: object
      properties:
        targetType:
          type: string
          enum: [thread, reply]
        targetId:
          type: number
          minimum: 1
          multipleOf: 1
        reason:
          type: string
          minLength: 10
          maxLength: 500
      required: [targetType, targetId, reason]
      additionalProperties: false
    ForumReportReceipt:
      type: object
      properties:
        received:
          type: boolean
        message:
          type: string
      required: [received, message]
    ForumModerationInput:
      type: object
      properties:
        action:
          type: string
          enum: [hide, remove, restore, lock, unlock, pin, unpin]
        reason:
          type: string
          maxLength: 500
      required: [action]
      additionalProperties: false
    ForumReportUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [resolved, dismissed]
      required: [status]
      additionalProperties: false
    ForumModerationReport:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        targetType:
          type: string
          enum: [thread, reply]
        targetId:
          type: number
          multipleOf: 1
        reason:
          type: string
        status:
          type: string
          enum: [pending, resolved, dismissed]
        reporter:
          $ref: "#/components/schemas/ForumAuthor"
        createdAt:
          type: string
          format: date-time
      required: [id, targetType, targetId, reason, status, reporter, createdAt]
    ForumModerationPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ForumModerationReport"
        pagination:
          $ref: "#/components/schemas/ForumPageInfo"
      required: [items, pagination]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

