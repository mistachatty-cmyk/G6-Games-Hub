openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: games
    description: Game social operations
  - name: members
    description: Member profiles, badges, and roles
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUser"
  /login:
    get:
      operationId: login
      tags: [auth]
      summary: Start sign-in
      responses:
        "302":
          description: Redirects to the identity provider
  /callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Complete sign-in
      responses:
        "302":
          description: Redirects back to the app
  /logout:
    get:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "302":
          description: Redirects back to the app
  /auth/providers:
    get:
      operationId: getAuthProviders
      tags: [auth]
      summary: List configured sign-in providers
      responses:
        "200":
          description: Sign-in provider availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
  /members/badges:
    get:
      operationId: getMemberBadges
      tags: [members]
      summary: List the G6 badge catalog
      responses:
        "200":
          description: Public badge catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Badge"
  /members/me:
    get:
      operationId: getMyMemberProfile
      tags: [members]
      summary: Get the signed-in member profile
      responses:
        "200":
          description: Current member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMyMemberProfile
      tags: [members]
      summary: Update the signed-in member profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberProfileInput"
      responses:
        "200":
          description: Updated member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "400":
          description: Invalid profile update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Display name already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/{userId}:
    get:
      operationId: getMemberPublicProfile
      tags: [members]
      summary: Get a public member profile
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: Public member profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberPublicProfile"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/roles:
    get:
      operationId: getMemberRoles
      tags: [members]
      summary: List member roles for the owner
      responses:
        "200":
          description: Member role assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberRoleRecord"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /members/roles/{userId}:
    patch:
      operationId: updateMemberRole
      tags: [members]
      summary: Assign or revoke an admin or moderator role
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleInput"
      responses:
        "200":
          description: Updated role assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberRoleRecord"
        "400":
          description: Invalid role update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/stats:
    get:
      operationId: getGameSocialStats
      tags: [games]
      summary: Get aggregate stars and this browser's star state
      parameters:
        - name: voterId
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Social stats for all registered games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSocialStats"
  /games/{slug}/star:
    post:
      operationId: toggleGameStar
      tags: [games]
      summary: Star or unstar a game for this browser
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameStarInput"
      responses:
        "200":
          description: Updated star state and aggregate count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSocialStats"
        "400":
          description: Invalid star request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/{slug}/feedback:
    post:
      operationId: submitGameFeedback
      tags: [games]
      summary: Send private feedback about a game
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameFeedbackInput"
      responses:
        "201":
          description: Feedback received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/feedback:
    get:
      operationId: getGameFeedback
      tags: [games]
      summary: List private feedback for the game owner
      responses:
        "200":
          description: Feedback grouped by game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackGroup"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/feedback/{id}:
    patch:
      operationId: reviewGameFeedback
      tags: [games]
      summary: Mark private feedback as reviewed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackReviewInput"
      responses:
        "200":
          description: Updated private feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackNote"
        "400":
          description: Invalid feedback review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required: [id, email, firstName, lastName, profileImageUrl]
    CurrentAuthUser:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        isOwner:
          type: boolean
        role:
          $ref: "#/components/schemas/MemberRole"
      required: [user, isOwner, role]
    AuthProvider:
      type: string
      enum: [replit, google, apple]
    AuthProviderOption:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/AuthProvider"
        label:
          type: string
        enabled:
          type: boolean
      required: [id, label, enabled]
    AuthProviders:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProviderOption"
      required: [providers]
    Badge:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        isSelectable:
          type: boolean
      required: [slug, name, description, isDefault, isSelectable]
    MemberRole:
      type: string
      enum: [member, moderator, admin, owner]
    MemberPublicProfile:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
        createdAt:
          type: string
          format: date-time
      required: [userId, displayName, badge, createdAt]
    MemberProfile:
      allOf:
        - $ref: "#/components/schemas/MemberPublicProfile"
        - type: object
          properties:
            role:
              $ref: "#/components/schemas/MemberRole"
            earnedBadges:
              type: array
              items:
                type: string
          required: [role, earnedBadges]
    MemberProfileInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 24
          pattern: "^[A-Za-z0-9][A-Za-z0-9 _-]{1,23}$"
        badgeSlug:
          type: string
          enum: [lok-clone, lok-knight, lokness-monster, lok-clown, lok-loner, lok-lit]
      minProperties: 1
      additionalProperties: false
    MemberRoleRecord:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        badge:
          $ref: "#/components/schemas/Badge"
        role:
          $ref: "#/components/schemas/MemberRole"
      required: [userId, displayName, badge, role]
    MemberRoleInput:
      type: object
      properties:
        role:
          type: string
          enum: [member, moderator, admin]
      required: [role]
      additionalProperties: false
    GameSocialStats:
      type: object
      properties:
        gameSlug:
          type: string
        starCount:
          type: number
          minimum: 0
        starred:
          type: boolean
      required: [gameSlug, starCount, starred]
    GameStarInput:
      type: object
      properties:
        voterId:
          type: string
          minLength: 16
          maxLength: 120
        starred:
          type: boolean
      required: [voterId, starred]
    GameFeedbackInput:
      type: object
      properties:
        content:
          type: string
          minLength: 4
          maxLength: 2000
      required: [content]
    FeedbackReceipt:
      type: object
      properties:
        received:
          type: boolean
        message:
          type: string
      required: [received, message]
    FeedbackAuthor:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
      required: [id, email, firstName, lastName]
    FeedbackNote:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        gameSlug:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, reviewed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/FeedbackAuthor"
      required: [id, gameSlug, content, status, createdAt, updatedAt, author]
    FeedbackGroup:
      type: object
      properties:
        gameSlug:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackNote"
      required: [gameSlug, notes]
    FeedbackReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [reviewed]
      required: [status]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

