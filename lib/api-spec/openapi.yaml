openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: games
    description: Game social operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/user:
    get:
      operationId: getCurrentAuthUser
      tags: [auth]
      summary: Get the current signed-in user
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentAuthUser"
  /login:
    get:
      operationId: login
      tags: [auth]
      summary: Start sign-in
      responses:
        "302":
          description: Redirects to the identity provider
  /callback:
    get:
      operationId: authCallback
      tags: [auth]
      summary: Complete sign-in
      responses:
        "302":
          description: Redirects back to the app
  /logout:
    get:
      operationId: logout
      tags: [auth]
      summary: Sign out
      responses:
        "302":
          description: Redirects back to the app
  /games/stats:
    get:
      operationId: getGameSocialStats
      tags: [games]
      summary: Get aggregate stars and this browser's star state
      parameters:
        - name: voterId
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
      responses:
        "200":
          description: Social stats for all registered games
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSocialStats"
  /games/{slug}/star:
    post:
      operationId: toggleGameStar
      tags: [games]
      summary: Star or unstar a game for this browser
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameStarInput"
      responses:
        "200":
          description: Updated star state and aggregate count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSocialStats"
        "400":
          description: Invalid star request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/{slug}/feedback:
    post:
      operationId: submitGameFeedback
      tags: [games]
      summary: Send private feedback about a game
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameFeedbackInput"
      responses:
        "201":
          description: Feedback received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/feedback:
    get:
      operationId: getGameFeedback
      tags: [games]
      summary: List private feedback for the game owner
      responses:
        "200":
          description: Feedback grouped by game
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackGroup"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /games/feedback/{id}:
    patch:
      operationId: reviewGameFeedback
      tags: [games]
      summary: Mark private feedback as reviewed
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
            multipleOf: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackReviewInput"
      responses:
        "200":
          description: Updated private feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackNote"
        "400":
          description: Invalid feedback review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Feedback not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
      required: [id, email, firstName, lastName, profileImageUrl]
    CurrentAuthUser:
      type: object
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
        isOwner:
          type: boolean
      required: [user, isOwner]
    GameSocialStats:
      type: object
      properties:
        gameSlug:
          type: string
        starCount:
          type: number
          minimum: 0
        starred:
          type: boolean
      required: [gameSlug, starCount, starred]
    GameStarInput:
      type: object
      properties:
        voterId:
          type: string
          minLength: 16
          maxLength: 120
        starred:
          type: boolean
      required: [voterId, starred]
    GameFeedbackInput:
      type: object
      properties:
        content:
          type: string
          minLength: 4
          maxLength: 2000
      required: [content]
    FeedbackReceipt:
      type: object
      properties:
        received:
          type: boolean
        message:
          type: string
      required: [received, message]
    FeedbackAuthor:
      type: object
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
      required: [id, email, firstName, lastName]
    FeedbackNote:
      type: object
      properties:
        id:
          type: number
          multipleOf: 1
        gameSlug:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [pending, reviewed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        author:
          $ref: "#/components/schemas/FeedbackAuthor"
      required: [id, gameSlug, content, status, createdAt, updatedAt, author]
    FeedbackGroup:
      type: object
      properties:
        gameSlug:
          type: string
        notes:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackNote"
      required: [gameSlug, notes]
    FeedbackReviewInput:
      type: object
      properties:
        status:
          type: string
          enum: [reviewed]
      required: [status]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]

